<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#3f5bff" />
      <stop offset="100%" stop-color="#344af0" />
    </linearGradient>
    <clipPath id="r">
      <rect x="0" y="0" width="512" height="512" rx="32" ry="32" />
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#g1)" clip-path="url(#r)" />

  <!-- diagonal glossy stripes -->
  <g clip-path="url(#r)" fill="#ffffff" opacity="0.06">
    <rect x="-200" y="40" width="260" height="520" transform="rotate(-22 30 30)" />
    <rect x="-80" y="-20" width="220" height="520" transform="rotate(-22 30 30)" />
    <rect x="40" y="-80" width="220" height="520" transform="rotate(-22 30 30)" />
  </g>

  <!-- subtle darker diagonal bar -->
  <g clip-path="url(#r)" fill="#0e2bff" opacity="0.08">
    <rect x="-140" y="120" width="420" height="420" transform="rotate(-22 30 30)" />
  </g>
</svg>
